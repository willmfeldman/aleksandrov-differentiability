name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Mathlib and its dependencies come from `lake exe cache get`, so cache only this project's
      # own build. Caching all of `.lake` exhausts runner disk.
      - name: Restore Lake artifacts
        uses: actions/cache/restore@v6
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-${{ hashFiles('AleksandrovDifferentiability.lean', 'AleksandrovDifferentiability/**/*.lean') }}
          restore-keys: |
            lake-build-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-
      - name: Fetch mathlib cache
        run: lake exe cache get
      # Warnings are errors: the release gate requires a warning-free build. The default targets
      # include the API smoke-test library AleksandrovDifferentiabilityComparator.
      - name: Build complete library
        run: lake build --wfail
      - name: Check trusted library source for sorry, admit, axioms, and native_decide
        run: python3 scripts/check_integrity.py
      - name: Enforce library source-file size limit
        run: |
          find AleksandrovDifferentiability -type f -name '*.lean' -exec wc -l {} + | \
            awk '$2 != "total" && $1 >= 1000 { print; bad = 1 } END { exit bad }'
          test "$(wc -l < AleksandrovDifferentiability.lean)" -lt 1000
      # check_integrity.py also fails on any library file whose first token is not `module`.
      - name: Check every library file is a Lean module
        run: python3 scripts/check_integrity.py
      - name: Validate manifest, library Lean names, and exact target axioms
        run: ruby scripts/check-formalization-manifest.rb
      # Challenge.lean states the challenges with `sorry` by design; the trusted statements and
      # the solutions must contain none.
      - name: Check challenge statements and solutions for sorry, axioms, and native_decide
        run: |
          ! grep -nE '\bsorry\b|^axiom |\badmit\b|native_decide' challenges/*/Statement.lean challenges/*/Solution.lean
      # Elaboration shows each Challenge and Solution compiles against this commit's library. It is
      # not a statement comparison; that is the release Comparator workflow's job.
      - name: Elaborate challenge workspaces (Statement, Challenge and Solution)
        run: |
          for config in challenges/*/config.json; do
            dir="${config%/config.json}"
            name="${dir#challenges/}"
            statement_dir="$RUNNER_TEMP/challenge-statements/$name"
            mkdir -p "$statement_dir"
            echo "== $dir"
            lake env lean -o "$statement_dir/Statement.olean" "$dir/Statement.lean"
            LEAN_PATH="$statement_dir" lake env lean "$dir/Challenge.lean"
            LEAN_PATH="$statement_dir" lake env lean "$dir/Solution.lean"
          done
      - name: Save Lake artifacts
        uses: actions/cache/save@v6
        if: always()
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-${{ hashFiles('AleksandrovDifferentiability.lean', 'AleksandrovDifferentiability/**/*.lean') }}
